[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salt-cavern-ml"
version = "0.1.0"
description = "Template pipeline for salt cavern deformation analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "shap>=0.45",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pyyaml>=6.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
clustering = [
  "umap-learn>=0.5.6",
  "hdbscan>=0.8.33",
  "tslearn>=0.6.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
